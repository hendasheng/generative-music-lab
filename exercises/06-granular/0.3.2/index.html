<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#deded5"><title>Granular · 0.3.2</title><link rel="stylesheet" href="style.css?v=032-2"></head>
<body><main>
<header class="mobile-header"><div class="flow-actions"><button id="menuToggle" class="icon-button" aria-label="菜单" aria-haspopup="dialog" aria-controls="settings" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg></button><button id="freeFlow" class="icon-button" aria-label="自由流动" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16c5 0 7-8 12-8a4 4 0 0 1 0 8c-5 0-7-8-12-8a4 4 0 1 0 0 8"/></svg></button></div><button id="record" class="icon-button record-button" aria-label="录制采样" aria-pressed="false"><span class="record-mark" aria-hidden="true"></span><span id="recordLabel" class="sr-only">录制采样 · 30s</span></button><div class="main-actions"><button id="mainPlay" class="icon-button" aria-label="播放"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg></button></div></header>
<div class="performance">
<div class="camera-group"><section class="camera-window" aria-label="摄像头实时预览"><video id="cameraVideo" autoplay muted playsinline></video><div class="camera-actions"><button id="cameraToggle" class="icon-button" aria-label="开启摄像头" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"/><circle cx="12" cy="13" r="3"/></svg></button><button id="cameraFlip" class="icon-button" aria-label="切换前后摄像头" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button></div><p id="cameraStatus" role="status">点击右上角相机开启预览</p><div class="sample-strip"><canvas id="wave" aria-label="采样波形、粒子与录音实时波形"></canvas><input id="positionSurface" type="range" min="0" max="1" step="0.001" value="0.35" aria-label="波形取样位置"><span id="duration"></span></div></section></div>
<div class="xy-group"><section class="xy-window" aria-label="取样控制"><div id="xyPad" class="xy-pad" tabindex="0" role="group" aria-label="取样控制"><span class="axis-label top">聚焦 / 正放</span><span class="axis-label bottom">散开 / 纯倒放</span><span class="axis-label left">起点</span><span class="axis-label right">终点</span><div class="cross horizontal"></div><div class="cross vertical"></div><div id="xyDot"></div></div></section><section id="coreParameters" aria-label="核心声音旋钮"></section></div>
</div>

<footer class="sr-only"><span id="status" role="status">就绪 · 点击播放</span><span id="recordTime"></span></footer>
<dialog id="settings"><div class="settings-heading"><h1>声音控制</h1><button id="closeSettings" class="icon-button" aria-label="关闭菜单"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div><p id="sampleName">内置音源 · 谐波片段</p><exercise-controls apply-seed></exercise-controls><div class="actions"><button id="demo">内置音源</button><label class="file-button">导入音频<input id="file" type="file" accept="audio/*"></label></div><div id="parameters" class="parameters"></div><h2>空间与输出</h2><div id="outputParameters"></div><a href="../0.3/">打开 0.3 桌面版本</a></dialog>
</main><script src="../../../shared/exercise-controls.js"></script><script src="engine.js?v=032-2"></script><script src="flow.js?v=032-2"></script><script src="recorder.js?v=032-2"></script><script src="camera.js?v=032-2"></script><script src="mobile.js?v=032-2"></script><script src="app.js?v=032-2"></script></body></html>
