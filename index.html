<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Generative Music Lab</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { max-width: 760px; margin: 0 auto; padding: 64px 24px; background: #101114; color: #e8e8e8; }
    h1 { margin-bottom: 8px; font-size: clamp(2rem, 6vw, 4rem); }
    p { color: #aaaeb8; line-height: 1.7; }
    .piece { display: block; margin-top: 32px; padding: 24px; color: inherit; text-decoration: none; border: 1px solid #30323a; border-radius: 16px; background: #191b20; }
    .piece:hover { border-color: #777e91; transform: translateY(-1px); }
    .number { color: #8f9bb3; font-variant-numeric: tabular-nums; }
    h2 { margin: 8px 0; }
  </style>
</head>
<body>
  <main>
    <h1>Generative Music Lab</h1>
    <p>用于学习、拆解和实践生成式音乐的个人实验室。</p>
    <a class="piece" href="exercises/01-ambient-pulse/">
      <span class="number">Exercise 01</span>
      <h2>Ambient Pulse</h2>
      <p>C 自然小调 · 氛围合成 · 动机发展 · 呼吸型节奏</p>
    </a>
    <a class="piece" href="exercises/02-aisatsana-markov/0.4/">
      <span class="number">Exercise 02</span>
      <h2>Aisatsana Markov 0.4</h2>
      <p>极简钢琴 · 马尔可夫乐句重组 · 记忆 + 重排</p>
    </a>
    <a class="piece" href="exercises/03-phase-process/0.3/">
      <span class="number">Exercise 03</span>
      <h2>Phase Loops 0.3</h2>
      <p>独立音符循环 · 3D 分层环带 · 系统音乐</p>
    </a>
    <a class="piece" href="exercises/04-wfc-loom/0.2/">
      <span class="number">Exercise 04</span>
      <h2>Note Tile Collapse 0.2</h2>
      <p>WFC 约束坍缩 · 二维单音 tile 填充 · 最小音乐映射</p>
    </a>
  </main>
</body>
</html>
